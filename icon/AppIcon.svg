<?xml version="1.0" encoding="UTF-8"?>
<!-- LidWiFi macOS App Icon - High Resolution Vector (1024x1024) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Vibrant violet to cyan/sky blue gradient matching reference -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#835bf8"/>
      <stop offset="45%" stop-color="#6977fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Subtle inner specular glow for native macOS depth -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Soft ambient shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#070918" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Centered Icon Canvas (824x824 inside 1024x1024 safe margin for macOS) -->
  <g transform="translate(100, 90)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="824" height="824" rx="188" fill="url(#bgGrad)" filter="url(#iconShadow)"/>
    <!-- Subtle Inner Border Highlight -->
    <rect x="2" y="2" width="820" height="820" rx="186" fill="url(#innerGlow)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.35"/>

    <!-- Crisp Vector Glyph matching user's design -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <!-- Horizontal base bar (representing closed laptop surface) -->
      <line x1="200" y1="590" x2="624" y2="590" stroke-width="52"/>

      <!-- Center dot -->
      <circle cx="412" cy="496" r="36" fill="#ffffff" stroke="none"/>

      <!-- Inner Wi-Fi Wave Arc -->
      <path d="M 314 416 A 136 136 0 0 1 510 416" stroke-width="52"/>

      <!-- Outer Wi-Fi Wave Arc -->
      <path d="M 238 340 A 242 242 0 0 1 586 340" stroke-width="52"/>
    </g>
  </g>
</svg>
